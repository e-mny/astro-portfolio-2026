name: Rebuild Astro Site

on:
  schedule:
    - cron: "0 0 1,15 * *" # run on 1st and 15th of each month

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Build Astro
        run: npm run build
